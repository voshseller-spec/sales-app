<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cold Call Trainer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Cold Call Trainer</h1>
      <p class="subtitle">Pitch the product. Win over the buyer.</p>
    </header>

    <main>
      <section class="card" id="product-card">
        <span class="card-label">Your product</span>
        <h2 id="product-name">Loading…</h2>
        <p class="tagline" id="product-tagline"></p>
        <p class="price" id="product-price"></p>
        <ul id="product-points"></ul>
        <p class="buyer-line" id="buyer-line"></p>
      </section>

      <section class="chat">
        <div id="messages" class="messages"></div>

        <div id="outcome" class="outcome hidden"></div>

        <form id="chat-form" class="chat-form">
          <input
            id="chat-input"
            type="text"
            placeholder="Type your pitch…"
            autocomplete="off"
          />
          <button type="submit" id="send-btn">Send</button>
        </form>

        <button id="restart-btn" class="restart hidden">New call</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
